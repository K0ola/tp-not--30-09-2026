spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookingdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Les erreurs metier (4xx renvoyees par les autres services) ne doivent pas ouvrir le circuit
        ignore-exceptions:
          - feign.FeignException$FeignClientException
  timelimiter:
    configs:
      default:
        timeout-duration: 6s

booking:
  scheduler:
    enabled: true
    # Expiration des paiements en attente : toutes les 5 minutes
    expiration-rate: 300000
    # Rappel des cours (24h avant) : toutes les heures
    reminder-cron: "0 0 * * * *"
  # Delai de paiement apres reservation (syntaxe Duration : 1h, 30m, 15s)
  payment-deadline: 1h
  # Annulation gratuite jusqu'a 24h avant le cours
  cancellation-deadline: 24h

springdoc:
  swagger-ui:
    path: /swagger-ui.html
server:
  port: 8092
