spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

payment:
  # Simulation : les paiements >= a ce montant sont refuses
  rejection-threshold: 100.00

springdoc:
  swagger-ui:
    path: /swagger-ui.html
server:
  port: 8093
