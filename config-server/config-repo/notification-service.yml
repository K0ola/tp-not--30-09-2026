spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

notification:
  scheduler:
    enabled: true
    # Nouvelle tentative d'envoi des notifications en attente / echouees : toutes les 5 minutes
    retry-rate: 300000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
server:
  port: 8094
