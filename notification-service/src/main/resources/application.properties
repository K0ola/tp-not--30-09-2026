spring.application.name=notification-service
server.port=8094
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

spring.datasource.url=jdbc:h2:mem:notificationdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.register-with-eureka=${EUREKA_ENABLED:true}
eureka.client.fetch-registry=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}

notification.scheduler.enabled=true
notification.scheduler.retry-rate=300000
